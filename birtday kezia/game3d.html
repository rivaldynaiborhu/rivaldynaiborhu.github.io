<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kezia Farm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }
  body {
    background:#1a0a00;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Press Start 2P',monospace;
    overflow:hidden;
  }
  #game-container {
    position:relative; width:800px; height:560px;
    border:4px solid #8B4513;
    box-shadow:0 0 0 4px #5c2d0e,0 0 0 8px #8B4513,0 0 40px rgba(255,180,50,0.4);
    overflow:hidden; background:#2d5a1b;
  }
  #hud {
    position:absolute; top:0; left:0; right:0; height:36px;
    background:linear-gradient(180deg,rgba(0,0,0,0.85),rgba(0,0,0,0.6));
    display:flex; align-items:center; padding:0 10px; gap:20px;
    z-index:100; border-bottom:2px solid #8B4513;
  }
  #hud span { color:#FFD700; font-size:7px; }
  #score-val { color:#7CFC00; }
  #task-val  { color:#FF9900; }
  #level-badge { color:#00cfff; }
  #controls-hint { color:#aaa; font-size:6px; margin-left:auto; }
  #game-canvas { position:absolute; top:36px; left:0; }

  /* DIALOG */
  #dialog-box {
    display:none; position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(180deg,#2c1810,#1a0d08);
    border-top:4px solid #8B4513;
    padding:14px 18px 12px; z-index:200; min-height:130px;
  }
  #dialog-name { color:#FFD700; font-size:8px; margin-bottom:8px; }
  #dialog-text { color:#fff; line-height:1.7; margin-bottom:10px; font-family:'VT323',monospace; font-size:17px; }
  #dialog-choices { display:flex; flex-direction:column; gap:5px; }
  .choice-btn {
    background:#3d2010; border:2px solid #8B4513; color:#FFD700;
    font-family:'Press Start 2P',monospace; font-size:6px;
    padding:6px 10px; cursor:pointer; text-align:left; transition:background 0.1s;
  }
  .choice-btn:hover { background:#6b3a1f; border-color:#FFD700; }
  .choice-btn.correct { background:#1a4a1a; border-color:#7CFC00; color:#7CFC00; }
  .choice-btn.wrong   { background:#4a1a1a; border-color:#ff4444; color:#ff4444; }
  #dialog-close {
    display:none; background:#8B4513; border:2px solid #FFD700; color:#FFD700;
    font-family:'Press Start 2P',monospace; font-size:7px;
    padding:6px 14px; cursor:pointer; margin-top:8px;
  }
  #dialog-close:hover { background:#a0522d; }

  /* FLASH */
  .result-flash {
    display:none; position:absolute; top:48%; left:50%;
    transform:translate(-50%,-50%);
    font-size:14px; z-index:400; text-shadow:2px 2px 0 #000;
  }
  @keyframes flashAnim {
    0%   { opacity:0; transform:translate(-50%,-60%) scale(0.5); }
    40%  { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
    80%  { opacity:1; transform:translate(-50%,-50%) scale(1); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(1); }
  }

  /* OVERLAY */
  .overlay {
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    z-index:500;
  }
  .overlay.active { display:flex; }

  /* TITLE */
  #title-screen {
    background:linear-gradient(180deg,#87CEEB 0%,#98D8C8 40%,#5d8a3c 40%,#4a7030 100%);
  }
  #title-screen h1 {
    font-size:18px; color:#FFD700;
    text-shadow:3px 3px 0 #8B4513,-1px -1px 0 #8B4513; margin-bottom:6px;
  }
  #title-screen h2 { font-size:9px; color:#fff; margin-bottom:30px; text-shadow:1px 1px 0 #333; }
  .title-deco { font-size:32px; margin-bottom:10px; }

  /* LEVEL COMPLETE */
  #level-complete-screen { background:radial-gradient(ellipse at center,#1a3a0a,#0a1a04); }
  #level-complete-screen .bigstar { font-size:38px; animation:spinStar 2s linear infinite; margin-bottom:10px; }
  @keyframes spinStar { 0%{transform:rotate(0deg) scale(1)} 50%{transform:rotate(180deg) scale(1.15)} 100%{transform:rotate(360deg) scale(1)} }
  #level-complete-screen h2 { font-size:13px; color:#FFD700; text-shadow:2px 2px 0 #8B4513; margin-bottom:8px; }
  #level-complete-screen p  { font-size:7px; color:#aef0a0; margin-bottom:22px; line-height:2.2; text-align:center; }

  /* BUTTONS */
  .pbtn {
    background:#8B4513; border:3px solid #FFD700; color:#FFD700;
    font-family:'Press Start 2P',monospace; font-size:8px;
    padding:10px 22px; cursor:pointer; animation:blink 1s infinite;
  }
  .pbtn:hover { background:#a0522d; animation:none; }
  .pbtn-purple {
    background:#440077; border:3px solid #dd99ff; color:#dd99ff;
    font-family:'Press Start 2P',monospace; font-size:8px;
    padding:10px 22px; cursor:pointer; animation:blink 1s infinite;
  }
  .pbtn-purple:hover { background:#6600cc; animation:none; }
  @keyframes blink { 50%{opacity:0.4;} }
</style>
</head>
<body>
<div id="game-container">

  <!-- TITLE -->
  <div id="title-screen" class="overlay active">
    <div class="title-deco">🌾🌻🍅</div>
    <h1>KEZIA'S QUIZ</h1>
    <h2>~ Relationship of Knowledge ~</h2>
    <button class="pbtn" onclick="startGame()">▶ MULAI BERMAIN</button>
  </div>

  <!-- LV1 COMPLETE -->
  <div id="level-complete-screen" class="overlay">
    <div class="bigstar">🌟🌟🌟</div>
    <h2>SELAMAT!</h2>
    <p id="lc-text">Semua soal berhasil dijawab!</p>
    <button class="pbtn" onclick="goToBirthday()">🎁 BUKA HADIAH SPESIAL</button>
  </div>



  <!-- HUD -->
  <div id="hud">
    <span>SKOR: <span id="score-val">0</span></span>
    <span>TASK: <span id="task-val">0/5</span></span>
    <span><span id="level-badge">LEVEL 1</span></span>
    <span id="controls-hint">WASD/Arrow=Gerak | E=Interaksi</span>
  </div>

  <!-- CANVAS -->
  <canvas id="game-canvas" width="800" height="524"></canvas>

  <!-- DIALOG -->
  <div id="dialog-box">
    <div id="dialog-name">???</div>
    <div id="dialog-text">...</div>
    <div id="dialog-choices"></div>
    <button id="dialog-close" onclick="closeDialog()">[ LANJUT ]</button>
  </div>

  <!-- FLASH L1 -->
  <div id="result-flash" class="result-flash"></div>

</div>

<script>
// ============================================================
// EDIT SOAL LEVEL 1 DI SINI
// ============================================================
var QUESTIONS_L1 = [
  {
    id: 0, taskLabel: "🌾 Ladang Gandum",
    question: "Kapan tanggal jadian kita",
    choices: ["11 September 2024", "9 November 2024", "19 September 2024", "19 November 2024"],
    correct: 1,
    clue: "Hint: Emergency Call di US"
  },
  {
    id: 1, taskLabel: "🍅 Kebun Tomat",
    question: "Dimana kita pertama kali makan bareng?",
    choices: ["Sushi Tei", "Kimukatsu", "Coco Ichibanya", "Ramen Ya"],
    correct: 2,
    clue: "Hint: Merhcantnya ada di Grand Indonesia"
  },
  {
    id: 2, taskLabel: "🐄 Kandang Sapi",
    question: "Kalimat andalanmu kalau lagi ngambek trus ditanya 'mau makan apa' ?",
    choices: ["Bebas", "Terserah", "Sa ikut saja", "Sa ga lapar"],
    correct: 1,
    clue: "Hint: ayoo dipikirkan secara logika"
  },
  {
    id: 3, taskLabel: "Tepi Sungai",
    question: "Tanggal Berapa sih kita ke Bandung dulu?",
    choices: ["20 April 2025", "28 Juni 2025", "16 Mei 2025", "19 April 2025"],
    correct: 3,
    clue: "Hint: Kita pertama kali naik whoosh ke 19 April 2025."
  },
  {
    id: 4, taskLabel: "🌻 Taman Bunga",
    question: "Apa nama Hotel kita waktu di Thailand?",
    choices: ["Swiss Bell", "Second Home Hotel", "First House Hotel", "BRT"],
    correct: 2,
    clue: "Hint: Hotel di pratunam dekat dengan mall Platinum"
  }
];
// ============================================================

var canvas = document.getElementById('game-canvas');
var ctx = canvas.getContext('2d');
var W = 800, H = 524;
var WORLD_W = 1600, WORLD_H = 1200;
var cam = { x: 0, y: 0 };

var player = {
  x: 400, y: 300, speed: 2.5,
  frame: 0, frameTimer: 0,
  dir: 2, moving: false,
  color: '#e8b87d', shirt: '#d44000', hat: '#8B4513'
};

var keys = {};
document.addEventListener('keydown', function(e) {
  keys[e.key] = true;
  if ((e.key === 'e' || e.key === 'E') && !dialogOpen) tryInteract();
  if (e.key === 'Escape') closeDialog();
});
document.addEventListener('keyup', function(e) { keys[e.key] = false; });

var score = 0;
var dialogOpen = false;
var gameStarted = false;
var completedTasks = [];

var tasks = [
  { x: 280,  y: 200, q: QUESTIONS_L1[0], done: false },
  { x: 1100, y: 180, q: QUESTIONS_L1[1], done: false },
  { x: 700,  y: 800, q: QUESTIONS_L1[2], done: false },
  { x: 180,  y: 900, q: QUESTIONS_L1[3], done: false },
  { x: 1300, y: 700, q: QUESTIONS_L1[4], done: false }
];

var npcs = (function() {
  return QUESTIONS_L1.map(function(q, i) {
    var x, y, tries = 0;
    do {
      x = 120 + Math.random() * (WORLD_W - 240);
      y = 120 + Math.random() * (WORLD_H - 240);
      tries++;
    } while (tries < 100 && (
      Math.sqrt((x-400)*(x-400)+(y-300)*(y-300)) < 200 ||
      tasks.some(function(t){ return Math.sqrt((x-t.x)*(x-t.x)+(y-t.y)*(y-t.y)) < 120; })
    ));
    return { x: x, y: y, clue: q.clue, taskId: i, color: ['#ff9900','#aa44ff','#00bbff','#ff4466','#44cc88'][i] };
  });
})();

var TREES=[], FLOWERS=[], ROCKS=[], CROPS=[];
(function() {
  for(var i=0;i<60;i++) TREES.push({x:Math.random()*WORLD_W,y:Math.random()*WORLD_H});
  for(var i=0;i<100;i++) FLOWERS.push({x:Math.random()*WORLD_W,y:Math.random()*WORLD_H,c:['#ff6699','#ffcc00','#ff8800','#cc44ff'][i%4]});
  for(var i=0;i<30;i++) ROCKS.push({x:Math.random()*WORLD_W,y:Math.random()*WORLD_H});
  for(var i=0;i<80;i++) CROPS.push({x:Math.random()*WORLD_W,y:Math.random()*WORLD_H,stage:Math.floor(Math.random()*4)});
})();
var PATHS = [
  {x:0,y:380,w:WORLD_W,h:60},
  {x:580,y:0,w:60,h:WORLD_H}
];
var WATER = [{x:800,y:600,w:300,h:200}];

function ws(wx,wy){ return {sx:wx-cam.x,sy:wy-cam.y}; }

function drawGrass(){
  ctx.fillStyle='#4a8c2a'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3f7825';
  for(var gx=0;gx<W;gx+=16)
    for(var gy=0;gy<H;gy+=16){
      var ox=(gx+cam.x)%32<16?4:0;
      ctx.fillRect(gx+ox,gy+(cam.y%16<8?3:0),3,3);
    }
}
function drawPaths(){
  for(var pi=0;pi<PATHS.length;pi++){
    var p=PATHS[pi], s=ws(p.x,p.y);
    ctx.fillStyle='#c9a06a'; ctx.fillRect(s.sx,s.sy,p.w,p.h);
    ctx.fillStyle='#b8905a';
    for(var i=0;i<p.w;i+=20) ctx.fillRect(s.sx+i,s.sy+5,3,p.h-10);
  }
}
function drawWater(){
  for(var wi=0;wi<WATER.length;wi++){
    var w=WATER[wi], s=ws(w.x,w.y);
    var g=ctx.createLinearGradient(s.sx,s.sy,s.sx,s.sy+w.h);
    g.addColorStop(0,'#3498db'); g.addColorStop(1,'#1a5f9e');
    ctx.fillStyle=g; ctx.fillRect(s.sx,s.sy,w.w,w.h);
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=2;
    var t=Date.now()/1000;
    for(var i=0;i<5;i++){
      var ry=s.sy+20+i*35+Math.sin(t*2+i)*5;
      ctx.beginPath(); ctx.moveTo(s.sx+20,ry);
      ctx.quadraticCurveTo(s.sx+w.w/2,ry+8,s.sx+w.w-20,ry); ctx.stroke();
    }
  }
}
function drawRocks(){
  for(var ri=0;ri<ROCKS.length;ri++){
    var r=ROCKS[ri], s=ws(r.x,r.y);
    if(s.sx<-20||s.sx>W+20||s.sy<-20||s.sy>H+20) continue;
    ctx.fillStyle='#888'; ctx.beginPath(); ctx.ellipse(s.sx,s.sy,10,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#aaa'; ctx.beginPath(); ctx.ellipse(s.sx-2,s.sy-2,5,3,-0.3,0,Math.PI*2); ctx.fill();
  }
}
function drawFlowers(){
  for(var fi=0;fi<FLOWERS.length;fi++){
    var f=FLOWERS[fi], s=ws(f.x,f.y);
    if(s.sx<-10||s.sx>W+10||s.sy<-10||s.sy>H+10) continue;
    ctx.fillStyle='#2d8a1a'; ctx.fillRect(s.sx,s.sy,2,8);
    ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(s.sx+1,s.sy-1,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(s.sx+1,s.sy-1,1.5,0,Math.PI*2); ctx.fill();
  }
}
function drawCrops(){
  var sc=['#8BC34A','#4CAF50','#2E7D32','#F9A825'], sh=[4,8,12,16];
  for(var ci=0;ci<CROPS.length;ci++){
    var c=CROPS[ci], s=ws(c.x,c.y);
    if(s.sx<-20||s.sx>W+20||s.sy<-20||s.sy>H+20) continue;
    ctx.fillStyle='#6d4c41'; ctx.fillRect(s.sx-4,s.sy+2,10,6);
    ctx.fillStyle='#558B2F'; ctx.fillRect(s.sx,s.sy-sh[c.stage],2,sh[c.stage]+2);
    ctx.fillStyle=sc[c.stage]; ctx.beginPath(); ctx.arc(s.sx+1,s.sy-sh[c.stage],c.stage*2+3,0,Math.PI*2); ctx.fill();
  }
}
function drawTree(sx,sy){
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(sx+4,sy+36,18,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6d3a0f'; ctx.fillRect(sx,sy+20,10,18);
  ctx.fillStyle='#8B4513'; ctx.fillRect(sx+2,sy+20,3,18);
  ctx.fillStyle='#1B5E20'; ctx.beginPath(); ctx.ellipse(sx+5,sy+14,22,16,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2E7D32'; ctx.beginPath(); ctx.ellipse(sx+5,sy+6,18,14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#388E3C'; ctx.beginPath(); ctx.ellipse(sx+5,sy,13,10,0,0,Math.PI*2); ctx.fill();
}
function drawTrees(){
  for(var ti=0;ti<TREES.length;ti++){
    var t=TREES[ti], s=ws(t.x,t.y);
    if(s.sx<-50||s.sx>W+50||s.sy<-50||s.sy>H+50) continue;
    drawTree(s.sx-5,s.sy-36);
  }
}
function drawFence(){
  ctx.strokeStyle='#8B4513'; ctx.lineWidth=3;
  var s1=ws(0,0); ctx.strokeRect(s1.sx,s1.sy,WORLD_W,WORLD_H);
  for(var fx=0;fx<WORLD_W;fx+=40){
    var s=ws(fx,0);
    if(s.sx<-10||s.sx>W+10) continue;
    ctx.fillStyle='#8B4513'; ctx.fillRect(s.sx-2,s.sy-2,6,20);
    ctx.fillStyle='#6d3a0f'; ctx.fillRect(s.sx-4,s.sy+4,10,4);
  }
}
function drawHouse(){
  var s=ws(60,60);
  ctx.fillStyle='#bfa07a'; ctx.fillRect(s.sx,s.sy+40,100,70);
  ctx.fillStyle='#e8c9a0'; ctx.fillRect(s.sx+4,s.sy+44,92,66);
  ctx.fillStyle='#c0392b';
  ctx.beginPath(); ctx.moveTo(s.sx-10,s.sy+44); ctx.lineTo(s.sx+50,s.sy); ctx.lineTo(s.sx+110,s.sy+44); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8B4513'; ctx.fillRect(s.sx+38,s.sy+80,24,30);
  ctx.fillStyle='#FFD700'; ctx.fillRect(s.sx+58,s.sy+93,3,4);
  ctx.fillStyle='#AED6F1'; ctx.fillRect(s.sx+8,s.sy+60,24,20); ctx.fillRect(s.sx+68,s.sy+60,24,20);
  ctx.strokeStyle='#8B4513'; ctx.lineWidth=2;
  ctx.strokeRect(s.sx+8,s.sy+60,24,20); ctx.strokeRect(s.sx+68,s.sy+60,24,20);
  ctx.fillStyle='#7f8c8d'; ctx.fillRect(s.sx+65,s.sy-15,14,25);
  ctx.fillStyle='rgba(200,200,200,0.45)';
  for(var i=0;i<3;i++){
    var st=(Date.now()/800+i*0.5)%3;
    ctx.beginPath(); ctx.arc(s.sx+72,s.sy-15-st*12,4+i*2,0,Math.PI*2); ctx.fill();
  }
}
function drawSun(){
  var t=Date.now()/2000;
  ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(W-80,60,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFA500';
  for(var i=0;i<8;i++){
    var angle=(i/8)*Math.PI*2+t;
    ctx.save(); ctx.translate(W-80,60); ctx.rotate(angle); ctx.fillRect(-2,30,4,12); ctx.restore();
  }
  var grd=ctx.createRadialGradient(W-80,60,20,W-80,60,80);
  grd.addColorStop(0,'rgba(255,220,0,0.25)'); grd.addColorStop(1,'rgba(255,220,0,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(W-80,60,80,0,Math.PI*2); ctx.fill();
}
function drawClouds(){
  var t=Date.now()/12000;
  var clouds=[{bx:0.1,by:0.06,s:1.1},{bx:0.35,by:0.04,s:0.8},{bx:0.6,by:0.08,s:1.3}];
  ctx.fillStyle='rgba(255,255,255,0.9)';
  for(var ci=0;ci<clouds.length;ci++){
    var c=clouds[ci];
    var cx=((c.bx*W+t*W*0.3)%(W+200))-100;
    var cy=c.by*H;
    ctx.save(); ctx.scale(c.s,c.s);
    var rx=cx/c.s, ry=cy/c.s;
    ctx.beginPath();
    ctx.arc(rx,ry,22,0,Math.PI*2); ctx.arc(rx+25,ry-10,18,0,Math.PI*2);
    ctx.arc(rx+50,ry,22,0,Math.PI*2); ctx.arc(rx+25,ry+10,20,0,Math.PI*2);
    ctx.fill(); ctx.restore();
  }
}
function drawTask(t){
  var s=ws(t.x,t.y);
  if(s.sx<-60||s.sx>W+60||s.sy<-40||s.sy>H+40) return;
  var bob=Math.sin(Date.now()/600)*3;
  if(t.done){
    ctx.fillStyle='#7CFC00'; ctx.font='20px serif';
    ctx.textAlign='center'; ctx.fillText('V',s.sx+2,s.sy-10); ctx.textAlign='left'; return;
  }
  ctx.fillStyle='#8B4513'; ctx.fillRect(s.sx-1,s.sy-30,4,30);
  ctx.fillStyle='#A0522D'; ctx.fillRect(s.sx-16,s.sy-52+bob,36,24);
  ctx.fillStyle='#8B4513'; ctx.fillRect(s.sx-16,s.sy-52+bob,36,3);
  ctx.fillStyle='#FFD700'; ctx.font='7px "Press Start 2P"';
  ctx.textAlign='center'; ctx.fillText('!',s.sx+2,s.sy-34+bob);
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(s.sx-42,s.sy-71+bob,88,15);
  ctx.fillStyle='#FFD700'; ctx.font='5px "Press Start 2P"';
  ctx.fillText(t.q.taskLabel,s.sx+2,s.sy-59+bob);
  ctx.textAlign='left';
}
function drawNPC(npc){
  var s=ws(npc.x,npc.y);
  if(s.sx<-40||s.sx>W+40||s.sy<-40||s.sy>H+40) return;
  var bob=Math.sin(Date.now()/500+npc.x)*2;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s.sx+8,s.sy+32,10,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=npc.color; ctx.fillRect(s.sx,s.sy+14+bob,16,16);
  ctx.fillStyle='#f5c98a'; ctx.fillRect(s.sx+2,s.sy+2+bob,12,12);
  ctx.fillStyle='#333'; ctx.fillRect(s.sx+4,s.sy+5+bob,2,2); ctx.fillRect(s.sx+9,s.sy+5+bob,2,2);
  ctx.fillStyle='#c0734e'; ctx.fillRect(s.sx+5,s.sy+9+bob,5,1);
  ctx.fillStyle='#5c3d1e'; ctx.fillRect(s.sx+1,s.sy+28+bob,5,5); ctx.fillRect(s.sx+9,s.sy+28+bob,5,5);
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fillRect(s.sx-14,s.sy-20+bob,46,16);
  ctx.fillStyle='#333'; ctx.font='7px "Press Start 2P"';
  ctx.textAlign='center'; ctx.fillText('?',s.sx+8,s.sy-8+bob); ctx.textAlign='left';
}
function drawPlayer(){
  var sx=player.x-cam.x, sy=player.y-cam.y;
  var f=player.moving?Math.floor(player.frame)%4:0;
  var leg=[0,3,0,-3][f];
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(sx+12,sy+34,10,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=player.hat; ctx.fillRect(sx+2,sy,20,5); ctx.fillRect(sx+6,sy-7,12,8);
  ctx.fillStyle=player.color; ctx.fillRect(sx+4,sy+4,16,14);
  if(player.dir===2){ ctx.fillStyle='#333'; ctx.fillRect(sx+7,sy+8,3,3); ctx.fillRect(sx+14,sy+8,3,3); ctx.fillStyle='#c0734e'; ctx.fillRect(sx+9,sy+13,6,1); }
  else if(player.dir!==0){ ctx.fillStyle='#333'; ctx.fillRect(player.dir===3?sx+14:sx+7,sy+8,3,3); }
  ctx.fillStyle=player.shirt; ctx.fillRect(sx+3,sy+17,18,14);
  ctx.fillStyle='#336699'; ctx.fillRect(sx+5,sy+19,14,12);
  ctx.fillStyle=player.shirt; ctx.fillRect(sx+7,sy+19,2,5); ctx.fillRect(sx+15,sy+19,2,5);
  ctx.fillStyle=player.shirt; ctx.fillRect(sx,sy+17,5,10); ctx.fillRect(sx+19,sy+17,5,10);
  ctx.fillStyle=player.color; ctx.fillRect(sx,sy+26,5,4); ctx.fillRect(sx+19,sy+26,5,4);
  ctx.fillStyle='#336699'; ctx.fillRect(sx+4,sy+30,7,6+leg); ctx.fillRect(sx+13,sy+30,7,6-leg);
  ctx.fillStyle='#4a2800'; ctx.fillRect(sx+3,sy+34+leg,9,4); ctx.fillRect(sx+12,sy+34-leg,9,4);
}

function drawProximityHints(){
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i]; if(t.done) continue;
    var d=Math.sqrt(Math.pow(player.x-t.x+2,2)+Math.pow(player.y-t.y+16,2));
    if(d<80){
      var s=ws(t.x,t.y);
      ctx.fillStyle='rgba(255,215,0,0.9)'; ctx.font='7px "Press Start 2P"';
      ctx.textAlign='center'; ctx.fillText('[E] Interaksi',s.sx+2,s.sy-75); ctx.textAlign='left';
    }
  }
  for(var i=0;i<npcs.length;i++){
    var npc=npcs[i];
    var d=Math.sqrt(Math.pow(player.x-npc.x+8,2)+Math.pow(player.y-npc.y+16,2));
    if(d<70){
      var s=ws(npc.x,npc.y);
      ctx.fillStyle='rgba(200,255,200,0.9)'; ctx.font='7px "Press Start 2P"';
      ctx.textAlign='center'; ctx.fillText('[E] Bicara',s.sx+8,s.sy-26); ctx.textAlign='left';
    }
  }
}

// ---- INTERACTION ----
function tryInteract(){
  if(dialogOpen) return;
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i]; if(t.done) continue;
    var d=Math.sqrt(Math.pow(player.x-t.x+2,2)+Math.pow(player.y-t.y+16,2));
    if(d<55){ showQuestion(t); return; }
  }
  for(var i=0;i<npcs.length;i++){
    var npc=npcs[i];
    var d=Math.sqrt(Math.pow(player.x-npc.x+8,2)+Math.pow(player.y-npc.y+16,2));
    if(d<55){ showClue(npc); return; }
  }
}
function showQuestion(task){
  dialogOpen=true;
  document.getElementById('dialog-box').style.display='block';
  document.getElementById('dialog-name').textContent=task.q.taskLabel;
  document.getElementById('dialog-text').textContent=task.q.question;
  var cel=document.getElementById('dialog-choices');
  cel.innerHTML='';
  document.getElementById('dialog-close').style.display='none';
  task.q.choices.forEach(function(ch,i){
    var btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=['A','B','C','D'][i]+'. '+ch;
    btn.onclick=(function(ti,bi,choicesEl){ return function(){ answerQuestion(ti,bi,choicesEl); }; })(task,i,cel);
    cel.appendChild(btn);
  });
}
function answerQuestion(task,chosen,choicesEl){
  var btns=choicesEl.querySelectorAll('.choice-btn');
  for(var i=0;i<btns.length;i++) btns[i].onclick=null;
  var correct=task.q.correct;
  btns[correct].classList.add('correct');
  var flash=document.getElementById('result-flash');
  if(chosen===correct){
    btns[chosen].classList.add('correct');
    score+=100; task.done=true; completedTasks.push(task.q.id);
    updateHUD();
    flash.textContent='BENAR! +100'; flash.style.color='#7CFC00';
    if(completedTasks.length===tasks.length){
      setTimeout(function(){ closeDialog(); showLv1Complete(); }, 900);
    }  } else {
    btns[chosen].classList.add('wrong');
    flash.textContent='SALAH!'; flash.style.color='#ff4444';
    score=Math.max(0,score-20); updateHUD();
  }
  flash.style.display='block';
  flash.style.animation='none';
  setTimeout(function(){ flash.style.animation='flashAnim 0.8s ease forwards'; },10);
  setTimeout(function(){ flash.style.display='none'; },900);
  document.getElementById('dialog-close').style.display='inline-block';
}
function showClue(npc){
  dialogOpen=true;
  var done=completedTasks.indexOf(npc.taskId)>-1;
  document.getElementById('dialog-box').style.display='block';
  document.getElementById('dialog-name').textContent='Petani (Task '+(npc.taskId+1)+')';
  document.getElementById('dialog-text').textContent=done
    ? 'Bagus sekali! Soal itu sudah kamu selesaikan. Terus semangat!'
    : npc.clue;
  document.getElementById('dialog-choices').innerHTML='';
  document.getElementById('dialog-close').style.display='inline-block';
}
function closeDialog(){
  dialogOpen=false;
  document.getElementById('dialog-box').style.display='none';
}
function updateHUD(){
  document.getElementById('score-val').textContent=score;
  document.getElementById('task-val').textContent=completedTasks.length+'/'+tasks.length;
}

// ---- LEVEL 1 COMPLETE ----
function showLv1Complete(){
  document.getElementById('lc-text').innerHTML=
    'Luar biasa! Semua '+tasks.length+' soal berhasil dijawab!<br>Skor kamu: <strong style="color:#FFD700">'+score+'</strong><br><br>Ada hadiah spesial untukmu...';
  showOverlay('level-complete-screen');
}

function goToBirthday(){
  window.location.href='birthday.html';
}

// ---- OVERLAY HELPER ----
var ALL_OVERLAYS = ['title-screen','level-complete-screen'];
function showOverlay(id){
  ALL_OVERLAYS.forEach(function(oid){
    document.getElementById(oid).classList.remove('active');
  });
  if(id) document.getElementById(id).classList.add('active');
}
function hideAllOverlays(){
  ALL_OVERLAYS.forEach(function(oid){
    document.getElementById(oid).classList.remove('active');
  });
}

// ---- GAME LOOP ----
var lastTime=0;
function gameLoop(ts){
  var dt=(ts-lastTime)/16; lastTime=ts;
  if(gameStarted){ update(dt); render(); }
  requestAnimationFrame(gameLoop);
}
function update(dt){
  if(!gameStarted||dialogOpen) return;
  var dx=0, dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-1;player.dir=1;}
  if(keys['ArrowRight']||keys['d']||keys['D']){dx=1;player.dir=3;}
  if(keys['ArrowUp']||keys['w']||keys['W']){dy=-1;player.dir=0;}
  if(keys['ArrowDown']||keys['s']||keys['S']){dy=1;player.dir=2;}
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  player.moving=dx!==0||dy!==0;
  if(player.moving){
    player.frameTimer+=dt;
    if(player.frameTimer>6){player.frame++;player.frameTimer=0;}
    player.x=Math.max(10,Math.min(WORLD_W-30,player.x+dx*player.speed*dt));
    player.y=Math.max(10,Math.min(WORLD_H-40,player.y+dy*player.speed*dt));
  }
  cam.x=Math.max(0,Math.min(WORLD_W-W,player.x-W/2+12));
  cam.y=Math.max(0,Math.min(WORLD_H-H,player.y-H/2+16));
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawGrass(); drawPaths(); drawWater(); drawRocks(); drawFlowers(); drawCrops();
  drawFence(); drawHouse(); drawTrees();
  for(var i=0;i<tasks.length;i++) drawTask(tasks[i]);
  for(var i=0;i<npcs.length;i++) drawNPC(npcs[i]);
  drawPlayer(); drawSun(); drawClouds();
  if(!dialogOpen) drawProximityHints();
}
function startGame(){
  gameStarted=true;
  hideAllOverlays();
  updateHUD();
  requestAnimationFrame(gameLoop);
}
</script>
