<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk &middot; Data Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card" id="loginCard">
    <!-- diisi oleh JS -->
  </div>
</div>

<script src="js/config.js"></script>
<script>
  const slug = getQueryParam('cat');
  const cat = getCategory(slug);
  const card = document.getElementById('loginCard');

  if (!cat) {
    window.location.href = 'index.html';
  } else if (isAuthenticated(slug)) {
    window.location.href = 'data.html?cat=' + encodeURIComponent(slug);
  } else {
    card.innerHTML = `
      <div class="login-icon-badge"><i class="bi ${cat.icon}"></i></div>
      <h4 class="mb-1 fw-bold">Akses Data: ${cat.label}</h4>
      <p class="mb-4" style="color: var(--text-muted); font-size: 0.88rem;">
        Masukkan password untuk melanjutkan ke data kategori ini.
      </p>
      <div id="errorBox" class="alert-soft mb-3 d-none">
        <i class="bi bi-exclamation-triangle me-1"></i><span id="errorText"></span>
      </div>
      <form id="loginForm" autocomplete="off">
        <label class="form-label" style="color: var(--text-muted); font-size: 0.85rem;">Password</label>
        <div class="position-relative mb-3">
          <input type="password" id="passwordInput" class="form-control dark-input"
                 placeholder="Masukkan password" required autofocus>
        </div>
        <button type="submit" class="btn-accent w-100 justify-content-center">
          <i class="bi bi-unlock"></i> Masuk
        </button>
      </form>
      <div class="text-center mt-4">
        <a href="index.html" class="breadcrumb-link">
          <i class="bi bi-arrow-left"></i> Kembali ke daftar kategori
        </a>
      </div>
    `;

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const value = document.getElementById('passwordInput').value;
      if (value === SITE_PASSWORD) {
        setAuthenticated(slug);
        window.location.href = 'data.html?cat=' + encodeURIComponent(slug);
      } else {
        const box = document.getElementById('errorBox');
        document.getElementById('errorText').textContent = 'Password salah. Silakan coba lagi.';
        box.classList.remove('d-none');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    });
  }
</script>
</body>
</html>
