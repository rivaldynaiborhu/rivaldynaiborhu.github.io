<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Data Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      Data Center
    </div>
    <a href="#" id="logoutBtn" class="btn-ghost">
      <i class="bi bi-box-arrow-right me-1"></i>Keluar
    </a>
  </div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <a href="index.html" class="breadcrumb-link"><i class="bi bi-arrow-left"></i> Semua kategori</a>
        <h1 class="mt-1" id="categoryTitle"></h1>
      </div>
    </div>

    <ul class="nav nav-tabs custom-tabs" id="sheetTabs" role="tablist">
      <li class="nav-item"><div class="spinner-wrap py-2"><i class="bi bi-hourglass-split"></i> Memuat daftar sheet...</div></li>
    </ul>

    <div class="data-toolbar">
      <div class="search-box">
        <i class="bi bi-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="Cari nama, CIF, perusahaan, cabang, dll...">
      </div>
      <span class="row-count-pill" id="rowCountPill">0 baris</span>
      <button type="button" id="downloadBtn" class="btn-accent">
        <i class="bi bi-download"></i> Download Excel
      </button>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <div id="tableContainer">
          <div class="spinner-wrap"><i class="bi bi-hourglass-split"></i> Memuat data...</div>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer" id="pageFooter"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
</body>
</html>
